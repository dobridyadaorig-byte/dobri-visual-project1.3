name: Unpack ZIP and Save JAR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unpack-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP file
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            exit 1
          fi
          unzip "$ZIP_FILE" -d unpacked_files/

      - name: Upload Unpacked Content
        uses: actions/upload-artifact@v4
        with:
          name: unpacked-archive-content
          path: unpacked_files/
          retention-days: 5
